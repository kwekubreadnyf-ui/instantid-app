<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InstantID - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #2980b9);
            color: white;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; text-align: center; padding: 20px;
        }
        .container { max-width: 500px; }
        h1 { font-size: 36px; margin-bottom: 10px; }
        p { font-size: 16px; color: #dfe6e9; margin-bottom: 30px; }
        .btn {
            display: inline-block; padding: 14px 28px;
            background: white; color: #2c3e50;
            text-decoration: none; border-radius: 6px;
            font-weight: bold; margin: 5px;
        }
        .btn.outline {
            background: transparent; color: white; border: 2px solid white;
        }
    </style>
</head>



<body>
    <div class="container">
        <h1>🚀 InstantID</h1>
        <p>Secure messaging with location tracking.</p>
        <a href="/signup.html" class="btn">Get Started</a>
        <a href="/login.html" class="btn outline">Log In</a>
    </div>

<a href="/download.html" style="display:inline-block; margin-top:20px; color:white; text-decoration:none; font-size:14px; opacity:0.85; border-bottom:1px dashed rgba(255,255,255,0.5); padding-bottom:3px;">📱 Install App</a>
<script>
    // Show install prompt if browser supports it
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // Show a banner after 5 seconds
        setTimeout(() => {
            const banner = document.createElement('div');
            banner.id = 'installBanner';
            banner.innerHTML = `
                <div style="position:fixed; bottom:20px; left:20px; right:20px; max-width:420px; margin:auto; background:white; padding:18px; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.25); z-index:9999; animation:slideUp 0.4s ease-out;">
                    <button onclick="document.getElementById('installBanner').remove()" style="position:absolute;top:10px;right:14px;background:transparent;border:none;font-size:20px;color:#7f8c8d;cursor:pointer;">×</button>
                    <p style="margin:0 0 5px 0; color:#2c3e50; font-size:16px; font-weight:bold;">📱 Install InstantID</p>
                    <p style="margin:0 0 14px 0; color:#7f8c8d; font-size:13px;">Get the app on your home screen for quick access and offline use.</p>
                    <button id="installNowBtn" style="background:#2980b9;color:white;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;font-size:14px;">Install App</button>
                </div>
                <style>
                    @keyframes slideUp {
                        from { transform: translateY(100%); opacity: 0; }
                        to { transform: translateY(0); opacity: 1; }
                    }
                </style>
            `;
            document.body.appendChild(banner);
            
            document.getElementById('installNowBtn').addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    banner.remove();
                }
            });
        }, 5000);
    });
</script>
</body>
</html>
