<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - InstantID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #2980b9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; font-size: 24px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; color: #2c3e50; font-size: 13px; margin-bottom: 5px; }
        input {
            width: 100%; padding: 12px; border: 1px solid #bdc3c7;
            border-radius: 5px; font-size: 14px;
        }
        input:focus { outline: none; border-color: #2980b9; }
        button {
            width: 100%; padding: 12px; background: #2980b9; color: white;
            border: none; border-radius: 5px; font-size: 15px;
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: #2471a3; }
        .error {
            background: #fadbd8; color: #922b21; padding: 10px;
            border-radius: 5px; margin-bottom: 15px; font-size: 13px; display: none;
        }
        .signup-link { text-align: center; margin-top: 20px; font-size: 13px; color: #7f8c8d; }
        .signup-link a { color: #2980b9; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Log in to InstantID</p>

        <div class="error" id="errorBox"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Your password">
            </div>
            <button type="submit">Log In</button>
        </form>

        <p class="signup-link">
            Don't have an account? <a href="/signup.html">Sign up</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const data = {
                email: form.email.value,
                password: form.password.value
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorBox.textContent = result.error || 'Login failed.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'Network error. Please try again.';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
