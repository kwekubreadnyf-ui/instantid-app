<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - InstantID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f7f6; min-height: 100vh; }
        .navbar {
            background: #2c3e50; color: white; padding: 15px 25px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .navbar h2 { font-size: 20px; }
        .navbar a {
            color: white; text-decoration: none; font-size: 14px;
            margin-left: 15px; padding: 8px 15px; border-radius: 5px;
        }
        .navbar a.active { background: #2980b9; }
        .navbar a:hover { background: #34495e; }
        .container { max-width: 700px; margin: 30px auto; padding: 0 20px; }
        .page-title { color: #2c3e50; margin-bottom: 20px; font-size: 24px; }
        .user-card {
            background: white; padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: transform 0.15s;
        }
        .user-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .user-card .avatar {
            width: 45px; height: 45px; border-radius: 50%;
            background: #2980b9; color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; margin-right: 15px;
        }
        .user-card .info { flex: 1; }
        .user-card .username { font-weight: bold; color: #2c3e50; font-size: 15px; }
        .user-card .email { color: #7f8c8d; font-size: 13px; margin-top: 2px; }
        .user-card .arrow { color: #bdc3c7; font-size: 20px; }
        .no-users {
            background: white; padding: 40px; border-radius: 10px;
            text-align: center; color: #7f8c8d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <div class="navbar">
    <h2>🚀 InstantID</h2>
    <div>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/users.html" class="active">Messages</a>
        <a href="/contacts.html">Contacts</a>
        <a href="#" onclick="logout(event)">Log Out</a>
    </div>
</div>

    <div class="container">
    <h1 class="page-title">Messages</h1>
    
    <div style="background:white; padding:20px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.08); margin-bottom:20px;">
        <h3 style="color:#2c3e50; font-size:16px; margin-bottom:12px;">✍️ Start a New Conversation</h3>
        <textarea id="quickMessage" placeholder="Type your message..." style="width:100%; padding:12px; border:1px solid #bdc3c7; border-radius:6px; font-size:14px; resize:vertical; min-height:70px; box-sizing:border-box; font-family:Arial;"></textarea>
        <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
            <button onclick="sendToRegistered()" style="flex:1; padding:12px; background:#2980b9; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; min-width:150px;">💬 Send to Registered User</button>
            <button onclick="sendViaWhatsApp()" style="flex:1; padding:12px; background:#25D366; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; min-width:150px;">📱 Send via WhatsApp</button>
        </div>
    </div>
    
    <h3 style="color:#2c3e50; font-size:16px; margin-bottom:12px;">Registered Users</h3>
    <div id="usersList">Loading...</div>
</div>

    <script>
        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                if (!res.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const users = await res.json();
                const list = document.getElementById('usersList');

                if (users.length === 0) {
                    list.innerHTML = `
                        <div class="no-users">
                            <p>No other users registered yet.</p>
                            <p style="margin-top:10px;">Share the app with someone and ask them to sign up!</p>
                        </div>`;
                    return;
                }

                list.innerHTML = users.map(u => `
                    <div class="user-card" onclick="openConversation(${u.id})">
                        <div style="display:flex; align-items:center;">
                            <div class="avatar">${u.username[0].toUpperCase()}</div>
                            <div class="info">
                                <div class="username">${u.username}</div>
                                <div class="email">${u.email}</div>
                            </div>
                        </div>
                        <div class="arrow">›</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('usersList').innerHTML = '<p>Error loading users.</p>';
            }
        }

        function openConversation(userId) {
            window.location.href = `/conversation.html?with=${userId}`;
        }

        async function logout(e) {
            e.preventDefault();
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }
async function sendViaWhatsApp() {
    const content = document.getElementById('quickMessage').value.trim();
    if (!content) { alert('Type a message first.'); return; }

    let contacts = [];
    try {
        const res = await fetch('/api/contacts');
        if (res.ok) contacts = await res.json();
    } catch (err) {}

    if (contacts.length === 0) {
        if (confirm('No contacts saved yet. Go to Contacts to add one?')) {
            window.location.href = '/contacts.html';
        }
        return;
    }

    const options = contacts.map((c, i) => `${i + 1}. ${c.name} (+${c.phone})`).join('\n');
    const choice = prompt(`Send WhatsApp message to:\n\n${options}\n\nEnter number (1-${contacts.length}):`);

    if (!choice) return;
    const idx = parseInt(choice) - 1;
    if (isNaN(idx) || idx < 0 || idx >= contacts.length) { alert('Invalid choice.'); return; }

    const contact = contacts[idx];

    try {
        const res = await fetch('/api/messages/external', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contactName: contact.name,
                contactPhone: contact.phone,
                content: content
            })
        });
        const data = await res.json();
        if (!res.ok) { alert('Failed: ' + (data.error || 'Unknown error')); return; }

        const replyLink = `${window.location.origin}/reply.html?token=${data.token}`;
        const waText = `Prince sent you a message on InstantID:\n\n"${content}"\n\nReply here: ${replyLink}`;
        window.open(`https://wa.me/${contact.phone}?text=${encodeURIComponent(waText)}`, '_blank');

        document.getElementById('quickMessage').value = '';
    } catch (err) {
        alert('Network error: ' + err.message);
    }
}

async function sendToRegistered() {
    const content = document.getElementById('quickMessage').value.trim();
    if (!content) { alert('Type a message first.'); return; }

    // Load users
    const res = await fetch('/api/users');
    if (!res.ok) { alert('Error loading users.'); return; }
    const users = await res.json();

    if (users.length === 0) { alert('No registered users yet.'); return; }

    const options = users.map((u, i) => `${i + 1}. ${u.username}`).join('\n');
    const choice = prompt(`Send to:\n\n${options}\n\nEnter number:`);

    if (!choice) return;
    const idx = parseInt(choice) - 1;
    if (isNaN(idx) || idx < 0 || idx >= users.length) { alert('Invalid choice.'); return; }

    const user = users[idx];

    try {
        const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ recipientId: user.id, content: content })
        });
        if (res.ok) {
            alert('Message sent!');
            document.getElementById('quickMessage').value = '';
            window.location.href = `/conversation.html?with=${user.id}`;
        } else {
            const err = await res.json();
            alert('Failed: ' + (err.error || 'Unknown error'));
        }
    } catch (err) {
        alert('Network error: ' + err.message);
    }
}
        loadUsers();
    </script>
</body>
</html>
