<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation - InstantID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif; background: #f4f7f6;
            height: 100vh; display: flex; flex-direction: column;
        }
        .navbar {
            background: #2c3e50; color: white; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .navbar .left { display: flex; align-items: center; gap: 15px; }
        .navbar .back {
            color: white; text-decoration: none; font-size: 22px;
            cursor: pointer; line-height: 1;
        }
        .navbar h2 { font-size: 17px; }
        .chat-container {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
            max-width: 800px; width: 100%; margin: 0 auto;
        }
        .message {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
        .message .time {
            font-size: 10px; color: #7f8c8d; margin-top: 5px;
        }
       .message .location {
    font-size: 11px;
    color: #2980b9;
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px dashed rgba(0,0,0,0.1);
    font-weight: bold;
    line-height: 1.4;
}
.message.sent .location {
    color: #ecf0f1;
    border-top: 1px dashed rgba(255,255,255,0.3);
}
        .message.sent {
            background: #2980b9; color: white;
            align-self: flex-end; border-bottom-right-radius: 4px;
        }
        .message.sent .time { color: rgba(255,255,255,0.7); }
        .message.sent .location { color: #ecf0f1; }
        .message.received {
            background: white; color: #2c3e50;
            align-self: flex-start; border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .message .sender {
            font-size: 11px; font-weight: bold; margin-bottom: 3px;
            color: #2980b9;
        }
        .input-bar {
            background: white; padding: 15px 20px;
            border-top: 1px solid #ecf0f1; flex-shrink: 0;
        }
        .input-bar form {
            max-width: 800px; margin: 0 auto;
            display: flex; gap: 10px;
        }
        .input-bar input {
            flex: 1; padding: 12px 15px;
            border: 1px solid #bdc3c7; border-radius: 25px;
            font-size: 14px;
        }
        .input-bar input:focus {
            outline: none; border-color: #2980b9;
        }
        .input-bar button {
            background: #2980b9; color: white; border: none;
            border-radius: 25px; padding: 0 25px;
            font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .input-bar button:hover { background: #2471a3; }
        .empty {
            text-align: center; color: #7f8c8d;
            padding: 40px 20px; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="left">
            <a href="/users.html" class="back">←</a>
            <h2 id="chatTitle">Loading...</h2>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="empty">Loading messages...</div>
    </div>

    <div class="input-bar">
    <form id="messageForm">
        <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
        <button type="submit">Send</button>
        <button type="button" id="whatsappBtn" style="background: #25D366; margin-left: 5px;">📱 WhatsApp</button>
    </form>
</div>

    <script>
        // Get the "with" parameter from the URL (e.g., /conversation.html?with=2)
        const params = new URLSearchParams(window.location.search);
        const otherUserId = parseInt(params.get('with'));

        if (!otherUserId) {
            window.location.href = '/users.html';
        }

        let myUserId = null;
        let otherUsername = '';

        // Load other user's name
        async function loadContact() {
            const res = await fetch('/api/users');
            if (!res.ok) { window.location.href = '/login.html'; return; }
            const users = await res.json();
            const other = users.find(u => u.id === otherUserId);
            if (!other) {
                window.location.href = '/users.html';
                return;
            }
            otherUsername = other.username;
            document.getElementById('chatTitle').textContent = `Chat with ${other.username}`;
        }

        // Load my own info
        async function loadMe() {
            const res = await fetch('/api/me');
            if (!res.ok) { window.location.href = '/login.html'; return; }
            const me = await res.json();
            myUserId = me.id;
        }

        // Load and render messages
        async function loadMessages() {
            try {
                const res = await fetch(`/api/messages/${otherUserId}`);
                if (!res.ok) return;
                const messages = await res.json();
                renderMessages(messages);
            } catch (err) {
                console.error('Load messages error:', err);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatContainer');
            if (messages.length === 0) {
    container.innerHTML = `
        <div class="empty" style="text-align:center; padding: 60px 20px;">
            <div style="font-size: 48px; margin-bottom: 15px;">💬</div>
            <h3 style="color: #2c3e50; margin-bottom: 8px;">No messages yet</h3>
            <p style="color: #7f8c8d; font-size: 14px;">Type a message below to start the conversation.</p>
        </div>`;
    return;
}

            container.innerHTML = messages.map(m => {
                const isReplyFromExternal = m.contact_name && m.contact_name.startsWith('Reply:');
const isSent = m.sender_id === myUserId && !isReplyFromExternal;
                const time = new Date(m.created_at + 'Z').toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Build the location line (with city, country, coordinates, and IP)
let locationLine = '';
if (m.sender_city || m.sender_country || m.sender_ip) {
    const parts = [];

    // City, Country
    if (m.sender_city && m.sender_country) {
        parts.push(`${m.sender_city}, ${m.sender_country}`);
    } else if (m.sender_city) {
        parts.push(m.sender_city);
    } else if (m.sender_country) {
        parts.push(m.sender_country);
    }

    // Coordinates (only if both lat and lon exist)
    if (m.sender_lat != null && m.sender_lon != null) {
        parts.push(`${Number(m.sender_lat).toFixed(4)}, ${Number(m.sender_lon).toFixed(4)}`);
    }

    // IP address
    if (m.sender_ip) {
        parts.push(`IP: ${m.sender_ip}`);
    }

    locationLine = `<div class="location">📍 ${parts.join(' | ')}</div>`;
}

                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        ${!isSent ? `<div class="sender">${m.sender_username}</div>` : ''}
                        <div>${escapeHtml(m.content)}</div>
                        ${locationLine}
                        <div class="time">${time}</div>
                    </div>
                `;
            }).join('');

            // Auto-scroll to the newest message
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Send a message
       document.getElementById('messageForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('messageInput');
    const sendBtn = e.target.querySelector('button[type="submit"]');
    const content = input.value.trim();
    if (!content) return;

    // Show sending state
    input.value = '';
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending...';

    try {
        const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ recipientId: otherUserId, content })
        });
        if (res.ok) {
            await loadMessages();
        } else {
            alert('Failed to send message.');
            input.value = content;  // restore text
        }
    } catch (err) {
        alert('Network error.');
        input.value = content;
    } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
    }
});

        // Initialize
        (async () => {
            await loadMe();
            await loadContact();
            await loadMessages();
            // ============================================
// SEND VIA WHATSAPP
// ============================================
document.getElementById('whatsappBtn').addEventListener('click', async () => {
    const content = document.getElementById('messageInput').value.trim();
    if (!content) {
        alert('Type a message first.');
        return;
    }

    // Ask which contact to send to (from the phonebook)
    let contacts = [];
    try {
        const res = await fetch('/api/contacts');
        if (res.ok) contacts = await res.json();
    } catch (err) {}

    if (contacts.length === 0) {
        const goAdd = confirm('No contacts saved yet. Do you want to add a contact now?');
        if (goAdd) window.location.href = '/contacts.html';
        return;
    }

    // Build a simple prompt for choosing
    const options = contacts.map((c, i) => `${i + 1}. ${c.name} (+${c.phone})`).join('\n');
    const choice = prompt(`Send via WhatsApp to which contact?\n\n${options}\n\nEnter number (1-${contacts.length}):`);

    if (!choice) return;
    const index = parseInt(choice) - 1;
    if (isNaN(index) || index < 0 || index >= contacts.length) {
        alert('Invalid selection.');
        return;
    }

    const contact = contacts[index];

    // Call backend to generate token + save message
    try {
        const res = await fetch('/api/messages/external', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contactName: contact.name,
                contactPhone: contact.phone,
                content: content
            })
        });

        const data = await res.json();

        if (!res.ok) {
            alert('Failed to send: ' + (data.error || 'Unknown error'));
            return;
        }

        // Build the WhatsApp URL
        const replyLink = `${window.location.origin}/reply.html?token=${data.token}`;
        const waText = `Prince sent you a message on InstantID:\n\n"${content}"\n\nReply here: ${replyLink}`;
        const waUrl = `https://wa.me/${contact.phone}?text=${encodeURIComponent(waText)}`;

        // Clear the input
        document.getElementById('messageInput').value = '';

        // Open WhatsApp
        window.open(waUrl, '_blank');

        // Refresh the conversation to show the sent message
        loadMessages();
    } catch (err) {
        alert('Network error: ' + err.message);
    }
});

            // Auto-refresh every 3 seconds
            setInterval(loadMessages, 3000);
        })();
    </script>
</body>
</html>
